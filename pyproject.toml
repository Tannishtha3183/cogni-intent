[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogni-intent"
version = "0.1.0"
description = "Mitigating Memory-Induced Drift in AI Agents"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Nishtha", email = "user@example.com"}
]
dependencies = [
    "torch",
    "sentence-transformers",
    "chromadb",
    "umap-learn",
    "scikit-learn>=1.3.0",
    "mlflow",
    "pandas",
    "numpy",
    "pydantic",
    "fastapi",
    "uvicorn",
    "streamlit",
    "google-genai; python_version >= '3.11'",
    "python-dotenv",
    "plotly"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff"
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]
