version: '3.8'

services:
  api:
    build: .
    container_name: cogni-intent-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - .:/app

  dashboard:
    build: .
    container_name: cogni-intent-dashboard
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - .:/app
    depends_on:
      - api
